<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HabyssT</title>
  <meta name="description" content="Seguimiento de hábitos con calendario mensual y anual de rachas. Tus datos se quedan en tu teléfono.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HabyssT">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>try { const t = JSON.parse(localStorage.getItem('habysst:ui'))?.theme; if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <main id="view"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="hoy">Hoy</button>
    <button data-tab="rachas">Progreso</button>
    <button data-tab="diario">Diario</button>
    <button data-tab="metas">Metas</button>
    <button data-tab="habitos">Ajustes</button>
  </nav>
  <dialog id="sheet"></dialog>
  <div id="zen" role="dialog" aria-modal="true" aria-label="Modo zen" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
