name = "habysst-push"
main = "index.js"
compatibility_date = "2025-06-01"

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "https://axg25.github.io/habysst/"
# VAPID_PUBLIC va aquí (no es secreto); VAPID_PRIVATE se guarda con: npx wrangler secret put VAPID_PRIVATE
VAPID_PUBLIC = "PEGAR_CLAVE_PUBLICA"

[[d1_databases]]
binding = "DB"
database_name = "habysst-push"
database_id = "PEGAR_ID_DE_LA_BASE"
